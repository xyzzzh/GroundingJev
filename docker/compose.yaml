name: groundingjev
services:
  groundingjev:
    image: ${GROUNDINGJEV_IMAGE:-groundingjev:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /workspace/GroundingJev
    user: "${GROUNDINGJEV_UID:-1000}:${GROUNDINGJEV_GID:-1000}"
    init: true
    shm_size: "8gb"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace/GroundingJev
      TOKENIZERS_PARALLELISM: "false"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      MODELSCOPE_CACHE: /cache/modelscope
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
      XDG_CACHE_HOME: /cache/xdg
      USE_HF: "0"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-2}"
      MKL_NUM_THREADS: "${MKL_NUM_THREADS:-2}"
      GROUNDINGJEV_NPROC_PER_NODE: "${GROUNDINGJEV_NPROC_PER_NODE:-1}"
      SWANLAB_API_KEY: "${SWANLAB_API_KEY:-}"
      SWANLAB_API_KEY_FILE: "${SWANLAB_API_KEY_FILE:-/workspace/GroundingJev/.secrets/swanlab_api_key}"
      SWANLAB_PROBE_GIT: "false"
    volumes:
      - type: bind
        source: ${GROUNDINGJEV_PROJECT_DIR}
        target: /workspace/GroundingJev
        bind: {create_host_path: false}
      - type: bind
        source: ${REFCOCO_ANNOTATIONS_DIR}
        target: /workspace/datasets/RefCOCO/annotations
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${REFCOCO_IMAGES_DIR}
        target: /workspace/datasets/RefCOCO/train2014
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${GROUNDINGJEV_MODELS_DIR}
        target: /models
        bind: {create_host_path: false}
      - type: bind
        source: ${GROUNDINGJEV_OUTPUTS_DIR}
        target: /outputs
        bind: {create_host_path: false}
      - type: bind
        source: ${GROUNDINGJEV_CACHE_DIR}
        target: /cache
        bind: {create_host_path: false}
    # scripts/docker.sh supplies explicit GPU device IDs from GPU_IDS.
    command: ["bash"]
